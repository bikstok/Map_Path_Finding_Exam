<!DOCTYPE html>
<html>
<head>
  <title>Storkøbenhavn Korteste Vej Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    #map {height:600px;width:100%;}
    #controls {margin:10px;}
    .road-label {
      background: white;
      padding: 2px 4px;
      border: 1px solid black;
      border-radius: 3px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h2>Storkøbenhavn Korteste Vej Finder</h2>

  <div id="controls">
    <label for="modeSelect">Vælg rute-mode:</label>
    <select id="modeSelect">
      <option value="exclude">Udeluk bestemte vejnavne (fx "Amager")</option>
      <option value="shortestName">Minimer samlede længde af vejnavne</option>
    </select>
    <span>Valgt mode: <span id="currentMode">exclude</span></span>
    <br/>
    <label for="excludeInput">Udelad substrings (komma-separeret):</label>
    <input id="excludeInput" type="text" placeholder="fx: Amager, Islands Brygge" style="width:300px" />
    <small id="excludeHint">(lad være tom for standard: Amager)</small>
  </div>

  <div id="map"></div>

  <script>
    const map = L.map('map').setView([55.676,12.558],12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

    let clicks = [];
    let markers = [];
    const modeSelect = document.getElementById('modeSelect');
    const currentModeLabel = document.getElementById('currentMode');
    const excludeInput = document.getElementById('excludeInput');
    const excludeHint = document.getElementById('excludeHint');

    modeSelect.addEventListener('change', ()=>{
      currentModeLabel.textContent = modeSelect.value;
    });

    // Show the current exclude preview
    excludeInput.addEventListener('input', ()=>{
      const v = excludeInput.value.trim();
      if(!v) excludeHint.textContent = '(lad være tom for standard: Amager)';
      else excludeHint.textContent = `Udelukker: ${v}`;
    });

    map.on('click', e=>{
      clicks.push(e.latlng);

      // Tilføj markør
      const marker = L.marker(e.latlng).addTo(map);
      markers.push(marker);

      if(clicks.length === 2){
        // parse exclude input into array of trimmed substrings
        const raw = excludeInput.value || '';
        const excludeArr = raw.split(',').map(s=>s.trim()).filter(s=>s.length>0);

        fetch('/api/route',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            startLat: clicks[0].lat,
            startLng: clicks[0].lng,
            endLat: clicks[1].lat,
            endLng: clicks[1].lng,
            mode: modeSelect.value,
            excludeNames: excludeArr
          })
        })
        .then(res=>res.json())
        .then(data=>{
          if(!data || !data.path){
            alert('Ingen rute fundet!');
            cleanup();
            return;
          }

          const route = data.path.map(n=>n.split(',').map(Number));
          L.polyline(route,{color:'blue',weight:5}).addTo(map);

          // Tilføj vejnavne langs ruten
          data.edges.forEach(edge=>{
            const [lat1,lng1] = edge.from.split(',').map(Number);
            const [lat2,lng2] = edge.to.split(',').map(Number);
            const midLat = (lat1 + lat2)/2;
            const midLng = (lng1 + lng2)/2;
            L.marker([midLat, midLng], {
              icon: L.divIcon({
                className:'road-label',
                html: edge.name || '',
                iconSize:[100,20]
              })
            }).addTo(map);
          });

          alert(`Rute fundet!
Distance: ${data.distanceKm} km
Besøgte noder: ${data.visitedNodes.length}
Beregningstid: ${data.durationMs} ms`);

          cleanup();
        });
      }
    });

    function cleanup(){
      clicks = [];
      markers.forEach(m => map.removeLayer(m));
      markers = [];
    }
  </script>
</body>
</html>
